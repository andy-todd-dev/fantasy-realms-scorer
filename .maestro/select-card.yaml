appId: dev.andytodd.realmsscorer
---
- runFlow: subflows/open-app.yaml

# The hand starts empty and is scored through the real wiring.
# The long wait covers Metro's first bundle on debug builds.
- extendedWaitUntil:
    visible:
      id: pick-cards
    timeout: 60000
- assertVisible: "No cards selected."
- assertVisible:
    id: hand-score
    text: "0"

# Features that aren't implemented yet are disabled
- assertVisible:
    id: new-hand
    enabled: false
- assertVisible:
    id: show-calculation
    enabled: false
- assertVisible:
    id: scan-hand
    enabled: false

# Cards load through the real wiring
- tapOn:
    id: pick-cards
# Leaders are partway down the alphabetical list, so scroll to them. Centring keeps the tiles
# clear of the hand tray, which grows as cards are added.
- scrollUntilVisible:
    element:
      id: card-tile-king
    direction: DOWN
    centerElement: true
- assertVisible:
    id: card-tile-queen
- assertVisible: "0 of 7"
- assertVisible: "Tap 7 more cards"
- assertVisible:
    id: pick-scan
    enabled: false

# Tapping King adds it and stays on the picker
- tapOn:
    id: card-tile-king
- assertVisible:
    id: hand-chip-king
- assertVisible: "1 of 7"
- assertVisible: "Tap 6 more cards"

# Removing isn't implemented yet, so tapping King again does nothing
- assertVisible:
    id: card-tile-king
    enabled: false
- tapOn:
    id: card-tile-king
- assertVisible: "1 of 7"

# Adding Queen puts it after King in the hand
- tapOn:
    id: card-tile-queen
- assertVisible: "2 of 7"
- tapOn:
    id: back-to-hand
- assertVisible:
    id: hand-card-queen
    below:
      id: hand-card-king
- assertVisible:
    id: hand-score
    text: "14"
- assertVisible:
    id: remove-card-king
    enabled: false
