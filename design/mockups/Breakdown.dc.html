<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score breakdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E3B75B}a:hover{color:#F0CD82}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141821; color: #EDE9E0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 0">
    <a href="Main.dc.html" aria-label="Back to cards" style="width: 44px; height: 44px; color: #EDE9E0; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <h1 style="margin: 0; font-family: Marcellus, Georgia, serif; font-size: 24px; font-weight: 400">Your hand: {{total}}</h1>
      <p style="margin: 0; font-size: 14px; color: {{countColor}}">{{countText}}</p>
    </div>
  </header>

  <div style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="padding: 10px 12px; border-radius: 12px; background: #1E2430"><p style="margin: 0; font-size: 12px; color: #A9B0BD">Base</p><p style="margin: 2px 0 0; font-size: 20px; font-weight: 600">{{base}}</p></div>
    <div style="padding: 10px 12px; border-radius: 12px; background: #1E2430"><p style="margin: 0; font-size: 12px; color: #A9B0BD">Bonuses</p><p style="margin: 2px 0 0; font-size: 20px; font-weight: 600; color: #9DD49A">+{{bonus}}</p></div>
    <div style="padding: 10px 12px; border-radius: 12px; background: #1E2430"><p style="margin: 0; font-size: 12px; color: #A9B0BD">Penalties</p><p style="margin: 2px 0 0; font-size: 20px; font-weight: 600">0</p></div>
  </div>

  <ol style="list-style: none; margin: 14px 0 0; padding: 0 16px 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <li style="padding: 6px 4px 12px 14px; border-radius: 16px; background: #1A1F2A; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; box-sizing: border-box; border: 1px solid #8D95A3; background: {{r.color}}"></span>
          <span style="flex: 1; font-size: 16px; font-weight: 600">{{r.name}} <span style="font-weight: 400; font-size: 12px; color: #A9B0BD">{{r.suit}}</span></span>
          <span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{accent}}">{{r.total}}</span>
          <button type="button" onClick="{{r.remove}}" aria-label="Remove {{r.name}} from hand" style="width: 44px; height: 44px; border: 0; background: transparent; color: #8D95A3; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #C9CED8; padding: 0 54px 0 20px"><span>Base strength</span><span style="font-variant-numeric: tabular-nums">{{r.base}}</span></div>
        <sc-if value="{{r.bonusText}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 0 54px 0 20px"><span style="color: #C9CED8; line-height: 1.4">{{r.why}}</span><span style="color: #9DD49A; font-variant-numeric: tabular-nums; flex: none">{{r.bonusText}}</span></div>
        </sc-if>
        <sc-if value="{{r.note}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; padding: 0 54px 0 20px; font-size: 12px; color: #A9B0BD; line-height: 1.4">{{r.note}}</p>
        </sc-if>
      </li>
    </sc-for>
  </ol>

  <footer style="padding: 14px 20px 28px; border-top: 1px solid #232A38; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 16px; color: #C9CED8">{{base}} + {{bonus}} − 0</span>
      <span style="font-family: Marcellus, Georgia, serif; font-size: 36px; color: {{accent}}">{{total}}</span>
    </div>
    <p style="margin: 0; font-size: 12px; color: #A9B0BD">Blanked cards: none</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E3B75B","options":["#E3B75B","#7FC4E8","#9DD49A"]},"$preview":{"width":390,"height":844}}'>
// Sample hand and figures only. In the app, removing a card re-runs the scoring engine,
// which can change other cards' bonuses too; here the row is simply taken out.
const ROWS = [
  { name: 'Unicorn', suit: 'Beast', color: '#1E7B3A', base: 9, bonus: 30, why: 'With Princess', note: '' },
  { name: 'Rangers', suit: 'Army', color: '#000000', base: 5, bonus: 20, why: '+10 × 2 Lands (Bell Tower, Mountain)', note: '' },
  { name: 'Bell Tower', suit: 'Land', color: '#8B5A2B', base: 8, bonus: 15, why: 'With a Wizard (Enchantress)', note: '' },
  { name: 'Enchantress', suit: 'Wizard', color: '#EE7FB8', base: 5, bonus: 15, why: '+5 × 3 (Bell Tower, Mountain, Island)', note: '' },
  { name: 'Princess', suit: 'Leader', color: '#8E44C9', base: 2, bonus: 16, why: '+8 × 2 (Rangers, Enchantress)', note: '' },
  { name: 'Island', suit: 'Flood', color: '#1F4FA8', base: 14, bonus: 0, why: '', note: 'No penalties in hand to clear.' },
  { name: 'Mountain', suit: 'Land', color: '#8B5A2B', base: 9, bonus: 0, why: '', note: 'Bonus needs Smoke and Wildfire, not in hand.' }
];
class Component extends DCLogic {
  state = { removed: [] };
  renderVals() {
    const accent = this.props.accent ?? '#E3B75B';
    const rows = ROWS.filter((r) => !this.state.removed.includes(r.name));
    const base = rows.reduce((t, r) => t + r.base, 0);
    const bonus = rows.reduce((t, r) => t + r.bonus, 0);
    const n = rows.length;
    return {
      accent,
      base,
      bonus,
      total: base + bonus,
      countText: n >= 7 ? n + ' cards · complete' : n + ' of 7 cards',
      countColor: n >= 7 ? accent : '#A9B0BD',
      rows: rows.map((r) => ({
        ...r,
        total: r.base + r.bonus,
        bonusText: r.bonus ? '+' + r.bonus : '',
        remove: () => this.setState({ removed: this.state.removed.concat(r.name) })
      }))
    };
  }
}
</script>
</body>
</html>
