<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E3B75B}a:hover{color:#F0CD82}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D12; color: #EDE9E0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 8px">
    <a href="Main.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; color: #EDE9E0; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Marcellus, Georgia, serif; font-size: 20px; font-weight: 400">Scan your hand</h1>
    <button type="button" aria-label="Flash off" style="width: 44px; height: 44px; border: 0; background: transparent; color: #EDE9E0; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path><path d="M3 3l18 18"></path></svg>
    </button>
  </header>

  <div role="img" aria-label="Camera viewfinder with 7 cards detected" style="position: relative; margin: 8px 16px 0; height: 520px; border-radius: 16px; background: #232016; overflow: hidden">
    <span style="position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 16px; background: rgba(11,13,18,0.8); font-size: 14px; font-weight: 600; color: {{accent}}">7 cards detected</span>
    <sc-for list="{{boxes}}" as="b" hint-placeholder-count="7">
      <div style="position: absolute; left: {{b.x}}px; top: {{b.y}}px; width: 92px; height: 132px; transform: rotate({{b.r}}deg); border-radius: 8px; background: #3B3527; border: 2px solid {{b.stroke}}; box-sizing: border-box">
        <span style="position: absolute; left: 4px; right: 4px; top: 6px; padding: 3px 4px; border-radius: 4px; background: rgba(11,13,18,0.85); font-size: 12px; font-weight: 600; color: {{b.label}}; text-align: center">{{b.name}}</span>
      </div>
    </sc-for>
  </div>

  <p style="margin: 14px 24px 0; font-size: 14px; color: #C9CED8; text-align: center; line-height: 1.45">Lay the cards flat with their names showing. One card is unclear: you can fix it on the next screen.</p>

  <div style="margin-top: auto; padding: 0 32px 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
    <button type="button" style="justify-self: start; min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #EDE9E0; font: 500 14px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
      Photos
    </button>
    <a href="ScanReview.dc.html" aria-label="Take photo" style="justify-self: center; width: 80px; height: 80px; border-radius: 40px; border: 4px solid #EDE9E0; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <span style="width: 64px; height: 64px; border-radius: 32px; background: {{accent}}"></span>
    </a>
    <a href="AddCard.dc.html" style="justify-self: end; min-height: 44px; padding: 0 8px; color: #EDE9E0; text-decoration: none; font: 500 14px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 4px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Pick
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E3B75B","options":["#E3B75B","#7FC4E8","#9DD49A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#E3B75B';
    const ok = { stroke: accent, label: '#EDE9E0' };
    const unsure = { stroke: '#F08A5D', label: '#F8B596' };
    return {
      accent,
      boxes: [
        { name: 'Princess', x: 22, y: 64, r: -6, ...ok },
        { name: 'Unicorn', x: 128, y: 56, r: 2, ...ok },
        { name: 'Rangers', x: 234, y: 70, r: 7, ...ok },
        { name: 'Enchantress', x: 30, y: 236, r: 4, ...ok },
        { name: 'Bell Tower?', x: 136, y: 228, r: -3, ...unsure },
        { name: 'Mountain', x: 240, y: 244, r: -8, ...ok },
        { name: 'Island', x: 128, y: 372, r: 5, ...ok }
      ]
    };
  }
}
</script>
</body>
</html>
