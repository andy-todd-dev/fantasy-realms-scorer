<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check scanned cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E3B75B}a:hover{color:#F0CD82}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141821; color: #EDE9E0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
    <a href="Scan.dc.html" aria-label="Retake photo" style="width: 44px; height: 44px; color: #EDE9E0; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-family: Marcellus, Georgia, serif; font-size: 24px; font-weight: 400">Check your cards</h1>
  </header>
  <p style="margin: 0 20px 14px; font-size: 14px; color: #C9CED8; line-height: 1.45">We found 7 cards. Confirm the one we weren't sure about, then add them to your hand.</p>

  <section aria-label="Needs checking" style="margin: 0 16px; padding: 14px; border-radius: 16px; background: #2A1F1A; border: 1px solid #F08A5D">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #F8B596">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
      Not sure about this card
    </div>
    <p style="margin: 8px 0 10px; font-size: 14px; color: #EDE9E0">Which card is it?</p>
    <div role="radiogroup" aria-label="Possible matches" style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{o.checked}}" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: #EDE9E0; font: 500 16px Inter, sans-serif; display: flex; align-items: center; gap: 10px; text-align: left">
          <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid {{o.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{o.dot}}"></span></span>
          <span style="flex: 1">{{o.name}}</span>
          <span style="font-size: 12px; color: #A9B0BD">{{o.suit}}</span>
        </button>
      </sc-for>
      <a href="AddCard.dc.html" style="min-height: 44px; color: {{accent}}; text-decoration: none; font: 600 14px Inter, sans-serif; display: flex; align-items: center; padding: 0 4px">None of these: pick from all cards</a>
    </div>
  </section>

  <h2 style="margin: 16px 20px 8px; font-family: Marcellus, Georgia, serif; font-size: 18px; font-weight: 400">Matched</h2>
  <ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{matched}}" as="m" hint-placeholder-count="6">
      <li style="min-height: 44px; padding: 0 12px; border-radius: 12px; background: #1A1F2A; display: flex; align-items: center; gap: 12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9DD49A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        <span style="flex: 1; font-size: 16px">{{m.name}}</span>
        <span style="font-size: 12px; color: #A9B0BD">{{m.suit}}</span>
      </li>
    </sc-for>
  </ul>

  <div style="margin-top: auto; padding: 12px 16px 28px; border-top: 1px solid #232A38">
    <a href="Breakdown.dc.html" style="min-height: 56px; border-radius: 16px; background: {{accent}}; color: #1A1408; text-decoration: none; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center">Looks right: see score</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E3B75B","options":["#E3B75B","#7FC4E8","#9DD49A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#E3B75B';
    const on = { checked: 'true', border: accent, bg: '#2E2A1E', dot: accent };
    const offS = { checked: 'false', border: '#4A5262', bg: 'transparent', dot: 'transparent' };
    return {
      accent,
      options: [
        { name: 'Bell Tower', suit: 'Land', ...on },
        { name: 'Book of Changes', suit: 'Artifact', ...offS },
        { name: 'Beastmaster', suit: 'Wizard', ...offS }
      ],
      matched: [
        { name: 'Princess', suit: 'Leader' },
        { name: 'Unicorn', suit: 'Beast' },
        { name: 'Rangers', suit: 'Army' },
        { name: 'Enchantress', suit: 'Wizard' },
        { name: 'Mountain', suit: 'Land' },
        { name: 'Island', suit: 'Flood' }
      ]
    };
  }
}
</script>
</body>
</html>
